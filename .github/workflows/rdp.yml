name: Linux VPS noVNC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: linux-vps-novnc
  cancel-in-progress: true

jobs:
  create-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install desktop environment and VNC server
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common
          # Configurar contraseña VNC (cámbiala si quieres)
          mkdir -p ~/.vnc
          echo "hieudz" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Start VNC server on display :1
        run: |
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          # Esperar a que arranque
          sleep 5

      - name: Install noVNC and websockify
        run: |
          sudo apt install -y python3-pip git
          pip3 install websockify
          git clone https://github.com/novnc/noVNC.git $GITHUB_WORKSPACE/noVNC

      - name: Start websockify
        run: |
          websockify --web $GITHUB_WORKSPACE/noVNC 6080 localhost:5901 &

      - name: Download cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start cloudflared tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:6080 --logfile $GITHUB_WORKSPACE/cloudflared.log &

      - name: Get tunnel URL and push to repo
        run: |
          sleep 10
          for i in {1..30}; do
            if grep -q "trycloudflare.com" $GITHUB_WORKSPACE/cloudflared.log; then
              break
            fi
            sleep 5
          done
          url=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' $GITHUB_WORKSPACE/cloudflared.log | head -1)
          if [ -z "$url" ]; then
            echo "No se pudo obtener la URL del túnel"
            exit 1
          fi
          vnc_link="${url}/vnc.html"
          echo "Remote link: $vnc_link"
          echo "$vnc_link" > remote-link.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote-link.txt
          git commit -m "Update remote link"
          git push

      - name: Keep session alive
        run: |
          end=$((SECONDS+19800))  # 5.5 horas en segundos
          while [ $SECONDS -lt $end ]; do
            echo "Sesión activa... $(date)"
            # Backup cada hora
            if [ $((SECONDS % 3600)) -lt 60 ]; then
              git pull
              git add .
              git commit -m "Auto backup $(date +'%Y%m%d%H%M')"
              git push
            fi
            sleep 60
          done
